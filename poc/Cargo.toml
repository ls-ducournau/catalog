[package]
name = "catalog-poc"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
vercel_runtime = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }

# Un binaire par fonction (documentation Vercel, runtime Rust).
[[bin]]
name = "sante"
path = "api/sante.rs"

[[bin]]
name = "bd"
path = "api/bd.rs"

[[bin]]
name = "calcul"
path = "api/calcul.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
